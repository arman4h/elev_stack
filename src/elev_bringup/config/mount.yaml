# Sensor mounts relative to base_link (REP-103: x forward, y left, z up). Metres / radians.
# Pitch is rotation about +y; POSITIVE pitch tilts the sensor's z-axis toward +x
# (lidar looking more downward/forward). If check_floor reports the floor tilting the
# wrong way, flip the sign. All values are NOMINAL until calibrated on flat ground.
base_to_livox:
  x: 0.0
  y: 0.0
  z: 0.0
  roll: 0.0
  pitch: 0.7853981634   # 45 deg
  yaw: 0.0

# Measured camera pose in base_link. Needed because the ZED publishes odom -> <zed_frame>;
# base_link is then attached below it using the inverse of this transform.
base_to_zed:
  x: 0.0
  y: 0.0
  z: 0.0
  roll: 0.0
  pitch: 0.0
  yaw: 0.0
